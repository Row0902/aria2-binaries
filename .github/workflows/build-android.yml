name: Build aria2 (Android)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "aria2 version (e.g., 1.37.0)"
        required: true
        default: "1.37.0"
      commit_sha:
        description: "Explicit commit SHA from aria2/aria2 (optional, defaults to master)"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref_name || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UPSTREAM_REPO: aria2/aria2
  UPSTREAM_BRANCH: master
  NDK_VERSION: r29
  ANDROID_API: 24

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo (for build scripts)
        uses: actions/checkout@v6

      - name: Checkout upstream aria2 source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.commit_sha || env.UPSTREAM_BRANCH }}
          path: aria2-src

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake autopoint libtool pkg-config \
            curl ca-certificates dpkg-dev

      - name: Build aria2 for aarch64
        run: |
          cd aria2-src
          ../scripts/build-android.sh aarch64
        env:
          ANDROID_API: ${{ env.ANDROID_API }}

      - name: Smoke test binary (via qemu)
        run: |
          sudo apt-get install -y -qq qemu-user-static
          # Set up QEMU LD prefix from NDK sysroot so the Bionic linker is found
          NDK_SYSROOT="${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          if [ -d "$NDK_SYSROOT/usr/lib/aarch64-linux-android" ]; then
            # Create minimal Android rootfs for QEMU
            mkdir -p /tmp/android-sysroot/system/bin /tmp/android-sysroot/system/lib64
            ln -sf "$NDK_SYSROOT/usr/lib/aarch64-linux-android/linker64" /tmp/android-sysroot/system/bin/linker64 2>/dev/null || true
            ln -sf "$NDK_SYSROOT/usr/lib/aarch64-linux-android/libc.so" /tmp/android-sysroot/system/lib64/libc.so 2>/dev/null || true
            ln -sf "$NDK_SYSROOT/usr/lib/aarch64-linux-android/libm.so" /tmp/android-sysroot/system/lib64/libm.so 2>/dev/null || true
            ln -sf "$NDK_SYSROOT/usr/lib/aarch64-linux-android/libdl.so" /tmp/android-sysroot/system/lib64/libdl.so 2>/dev/null || true
            QEMU_LD_PREFIX=/tmp/android-sysroot qemu-aarch64-static aria2-src/dist/aria2c-android-aarch64 --version
            QEMU_LD_PREFIX=/tmp/android-sysroot qemu-aarch64-static aria2-src/dist/aria2c-android-aarch64 --help > /dev/null
            echo "✅ Smoke test passed"
          else
            echo "⚠️  NDK sysroot not found at expected path, skipping smoke test"
            ls -la "${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/" 2>/dev/null || echo "NDK lib dir not found"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2c-android-aarch64
          path: aria2-src/dist/aria2c-android-aarch64
          compression-level: 0

  build-armv7:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo (for build scripts)
        uses: actions/checkout@v6

      - name: Checkout upstream aria2 source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.commit_sha || env.UPSTREAM_BRANCH }}
          path: aria2-src

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake autopoint libtool pkg-config \
            curl ca-certificates dpkg-dev

      - name: Build aria2 for armv7
        run: |
          cd aria2-src
          ../scripts/build-android.sh armv7
        env:
          ANDROID_API: ${{ env.ANDROID_API }}

      - name: Smoke test binary (via qemu)
        run: |
          sudo apt-get install -y -qq qemu-user-static
          NDK_SYSROOT="${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          if [ -d "$NDK_SYSROOT/usr/lib/arm-linux-androideabi" ]; then
            mkdir -p /tmp/android-sysroot/system/bin /tmp/android-sysroot/system/lib
            ln -sf "$NDK_SYSROOT/usr/lib/arm-linux-androideabi/linker" /tmp/android-sysroot/system/bin/linker 2>/dev/null || true
            ln -sf "$NDK_SYSROOT/usr/lib/arm-linux-androideabi/libc.so" /tmp/android-sysroot/system/lib/libc.so 2>/dev/null || true
            ln -sf "$NDK_SYSROOT/usr/lib/arm-linux-androideabi/libm.so" /tmp/android-sysroot/system/lib/libm.so 2>/dev/null || true
            ln -sf "$NDK_SYSROOT/usr/lib/arm-linux-androideabi/libdl.so" /tmp/android-sysroot/system/lib/libdl.so 2>/dev/null || true
            QEMU_LD_PREFIX=/tmp/android-sysroot qemu-arm-static aria2-src/dist/aria2c-android-armv7 --version
            QEMU_LD_PREFIX=/tmp/android-sysroot qemu-arm-static aria2-src/dist/aria2c-android-armv7 --help > /dev/null
            echo "✅ Smoke test passed"
          else
            echo "⚠️  NDK sysroot not found, skipping smoke test"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2c-android-armv7
          path: aria2-src/dist/aria2c-android-armv7
          compression-level: 0

  build-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo (for build scripts)
        uses: actions/checkout@v6

      - name: Checkout upstream aria2 source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.commit_sha || env.UPSTREAM_BRANCH }}
          path: aria2-src

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake autopoint libtool pkg-config \
            curl ca-certificates dpkg-dev

      - name: Build aria2 for x86_64
        run: |
          cd aria2-src
          ../scripts/build-android.sh x86_64
        env:
          ANDROID_API: ${{ env.ANDROID_API }}

      - name: Smoke test binary (via qemu)
        run: |
          sudo apt-get install -y -qq qemu-user-static
          NDK_SYSROOT="${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          if [ -d "$NDK_SYSROOT/usr/lib/x86_64-linux-android" ]; then
            mkdir -p /tmp/android-sysroot/system/bin /tmp/android-sysroot/system/lib64
            ln -sf "$NDK_SYSROOT/usr/lib/x86_64-linux-android/linker64" /tmp/android-sysroot/system/bin/linker64 2>/dev/null || true
            ln -sf "$NDK_SYSROOT/usr/lib/x86_64-linux-android/libc.so" /tmp/android-sysroot/system/lib64/libc.so 2>/dev/null || true
            ln -sf "$NDK_SYSROOT/usr/lib/x86_64-linux-android/libm.so" /tmp/android-sysroot/system/lib64/libm.so 2>/dev/null || true
            ln -sf "$NDK_SYSROOT/usr/lib/x86_64-linux-android/libdl.so" /tmp/android-sysroot/system/lib64/libdl.so 2>/dev/null || true
            QEMU_LD_PREFIX=/tmp/android-sysroot qemu-x86_64-static aria2-src/dist/aria2c-android-x86_64 --version
            QEMU_LD_PREFIX=/tmp/android-sysroot qemu-x86_64-static aria2-src/dist/aria2c-android-x86_64 --help > /dev/null
            echo "✅ Smoke test passed"
          else
            echo "⚠️  NDK sysroot not found, skipping smoke test"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2c-android-x86_64
          path: aria2-src/dist/aria2c-android-x86_64
          compression-level: 0
