name: Build aria2 (macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "aria2 version tag (e.g. release-1.37.0)"
        required: true
        default: "release-1.37.0"
  push:
    tags:
      - "release-*"

jobs:
  build-x86_64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aria2/aria2
          ref: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'release-1.37.0' }}
      - run: |
          brew update
          brew install autoconf automake libtool pkg-config \
            openssl libxml2 expat c-ares sqlite3
      - run: |
          ./configure ARIA2_STATIC=yes --prefix=/tmp/aria2-install \
            --without-libgnutls --with-openssl
          make -j"$(sysctl -n hw.logicalcpu)" && make install-strip
      - run: |
          mkdir -p dist
          cp /tmp/aria2-install/bin/aria2c dist/aria2c-darwin-x86_64
          chmod +x dist/aria2c-darwin-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: aria2c-darwin-x86_64
          path: dist/aria2c-darwin-x86_64
          compression-level: 0

  build-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aria2/aria2
          ref: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'release-1.37.0' }}
      - run: |
          brew update
          brew install autoconf automake libtool pkg-config \
            openssl libxml2 expat c-ares sqlite3
      - run: |
          ./configure ARIA2_STATIC=yes --prefix=/tmp/aria2-install \
            --without-libgnutls --with-openssl
          make -j"$(sysctl -n hw.logicalcpu)" && make install-strip
      - run: |
          mkdir -p dist
          cp /tmp/aria2-install/bin/aria2c dist/aria2c-darwin-arm64
          chmod +x dist/aria2c-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: aria2c-darwin-arm64
          path: dist/aria2c-darwin-arm64
          compression-level: 0
