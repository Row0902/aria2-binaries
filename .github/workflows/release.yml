name: Release aria2 binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "aria2 version (e.g., 1.37.0)"
        required: true
        default: "1.37.0"
      commit_sha:
        description: "Explicit commit SHA from aria2/aria2 (optional, defaults to master)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref_name || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UPSTREAM_REPO: aria2/aria2
  UPSTREAM_BRANCH: master
  NDK_VERSION: r29
  ANDROID_API: 24
  DEPS_PREFIX: /tmp/aria2-deps

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            host: ""
            strip-cmd: strip
            deps_mode: native
            qemu_test: ""
          - arch: aarch64
            host: aarch64-linux-gnu
            strip-cmd: aarch64-linux-gnu-strip
            deps_mode: cross
            qemu_test: qemu-aarch64-static
          - arch: armv7
            host: arm-linux-gnueabihf
            strip-cmd: arm-linux-gnueabihf-strip
            deps_mode: cross
            qemu_test: qemu-arm-static
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo (for build scripts)
        uses: actions/checkout@v6

      - name: Checkout upstream aria2
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.commit_sha || env.UPSTREAM_BRANCH }}
          path: aria2-src

      - name: Install build dependencies (native)
        if: ${{ matrix.deps_mode == 'native' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake autopoint libtool pkg-config \
            libcppunit-dev libssl-dev libxml2-dev libexpat1-dev \
            liblzma-dev libgpg-error-dev \
            zlib1g-dev libsqlite3-dev libssh2-1-dev g++ make curl

      - name: Build c-ares from source (static)
        if: ${{ matrix.deps_mode == 'native' }}
        run: |
          mkdir -p /tmp/cares-build
          cd /tmp/cares-build
          CARES_VERSION="1.34.6"
          curl -fSL -o "c-ares-$CARES_VERSION.tar.gz" \
            "https://github.com/c-ares/c-ares/releases/download/v${CARES_VERSION}/c-ares-${CARES_VERSION}.tar.gz"
          tar xf "c-ares-$CARES_VERSION.tar.gz"
          cd "c-ares-$CARES_VERSION"
          ./configure --prefix="${{ env.DEPS_PREFIX }}" \
            --disable-shared --enable-static \
            --disable-tests --disable-debug
          make -j"$(nproc)" install

      - name: Install cross-toolchain
        if: ${{ matrix.deps_mode == 'cross' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake autopoint libtool pkg-config \
            g++-${{ matrix.host }} binutils-${{ matrix.host }} \
            curl make ca-certificates

      - name: Build all deps from source (cross)
        if: ${{ matrix.deps_mode == 'cross' }}
        run: |
          bash scripts/build-deps-linux.sh ${{ matrix.arch }} "${{ env.DEPS_PREFIX }}"

      - name: Generate configure script
        working-directory: aria2-src
        run: autoreconf -i

      - name: Configure, build, install
        working-directory: aria2-src
        run: |
          HOST_FLAG="${{ matrix.host && format('--host={0}', matrix.host) }}"

          export PKG_CONFIG_PATH="${{ env.DEPS_PREFIX }}/lib/pkgconfig"
          export CPATH="${{ env.DEPS_PREFIX }}/include"
          export LIBRARY_PATH="${{ env.DEPS_PREFIX }}/lib"

          ./configure ARIA2_STATIC=yes --prefix=/tmp/aria2-install \
            $HOST_FLAG --without-libgnutls --with-openssl \
            --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt

          make -j"$(nproc)" && make install-strip

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp /tmp/aria2-install/bin/aria2c "$GITHUB_WORKSPACE/dist/aria2c-linux-${{ matrix.arch }}"
          ${{ matrix.strip-cmd }} "$GITHUB_WORKSPACE/dist/aria2c-linux-${{ matrix.arch }}"
          chmod +x "$GITHUB_WORKSPACE/dist/aria2c-linux-${{ matrix.arch }}"

      - name: Smoke test binary
        run: |
          TEST_CMD="${{ matrix.qemu_test }}"
          if [ -n "$TEST_CMD" ]; then
            sudo apt-get install -y -qq qemu-user-static
            $TEST_CMD ./dist/aria2c-linux-${{ matrix.arch }} --version
            $TEST_CMD ./dist/aria2c-linux-${{ matrix.arch }} --help > /dev/null
          else
            ./dist/aria2c-linux-${{ matrix.arch }} --version
            ./dist/aria2c-linux-${{ matrix.arch }} --help > /dev/null
          fi
          echo "✅ Smoke test passed"

      - uses: actions/upload-artifact@v7
        with:
          name: aria2c-linux-${{ matrix.arch }}
          path: dist/aria2c-linux-${{ matrix.arch }}
          compression-level: 0

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.commit_sha || env.UPSTREAM_BRANCH }}

      - name: Install build dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config \
            openssl libxml2 expat c-ares sqlite3

      - name: Generate configure script
        run: autoreconf -i

      - name: Configure, build, install
        run: |
          ./configure ARIA2_STATIC=yes --prefix=/tmp/aria2-install \
            --without-libgnutls --with-openssl
          make -j"$(sysctl -n hw.logicalcpu)" && make install-strip

          mkdir -p dist
          cp /tmp/aria2-install/bin/aria2c "dist/aria2c-darwin-${{ matrix.arch }}"
          chmod +x "dist/aria2c-darwin-${{ matrix.arch }}"

      - name: Smoke test binary
        run: |
          ./dist/aria2c-darwin-${{ matrix.arch }} --version
          ./dist/aria2c-darwin-${{ matrix.arch }} --help > /dev/null
          echo "✅ Smoke test passed"

      - uses: actions/upload-artifact@v7
        with:
          name: aria2c-darwin-${{ matrix.arch }}
          path: dist/aria2c-darwin-${{ matrix.arch }}
          compression-level: 0

  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.commit_sha || env.UPSTREAM_BRANCH }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-c-ares mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libxml2 mingw-w64-x86_64-expat
            mingw-w64-x86_64-sqlite3 mingw-w64-x86_64-zlib
            autoconf automake libtool pkg-config gettext-devel

      - name: Generate configure script
        # -fi: force rebuild, ignore missing autopoint data
        run: autoreconf -fi

      - name: Configure, build, install
        run: |
          ./configure ARIA2_STATIC=yes --prefix=/tmp/aria2-install \
            --host=x86_64-w64-mingw32 --without-libgnutls \
            --with-openssl --without-libssh2 \
            --disable-websocket
          make -j"$(nproc)" && make install-strip

      - name: Package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item /tmp/aria2-install/bin/aria2c.exe dist/aria2c-windows-amd64.exe -Force

      - name: Smoke test binary
        shell: pwsh
        run: |
          .\dist\aria2c-windows-amd64.exe --version
          .\dist\aria2c-windows-amd64.exe --help | Out-Null
          Write-Host "✅ Smoke test passed"

      - uses: actions/upload-artifact@v7
        with:
          name: aria2c-windows-amd64
          path: dist/aria2c-windows-amd64.exe
          compression-level: 0

  build-android:
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7, x86_64]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo (for build scripts)
        uses: actions/checkout@v6

      - name: Checkout upstream aria2 source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.commit_sha || env.UPSTREAM_BRANCH }}
          path: aria2-src

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake autopoint libtool pkg-config \
            curl ca-certificates dpkg-dev

      - name: Build aria2 for ${{ matrix.arch }}
        run: |
          cd aria2-src
          ../scripts/build-android.sh ${{ matrix.arch }}
        env:
          ANDROID_API: ${{ env.ANDROID_API }}

      - name: Smoke test binary (via qemu)
        run: |
          sudo apt-get install -y -qq qemu-user-static
          QEMU_CMD="qemu-${{ matrix.arch }}-static"
          # armv7 uses qemu-arm-static, not qemu-armv7-static
          if [ "${{ matrix.arch }}" = "armv7" ]; then
            QEMU_CMD="qemu-arm-static"
          fi
          $QEMU_CMD aria2-src/dist/aria2c-android-${{ matrix.arch }} --version
          $QEMU_CMD aria2-src/dist/aria2c-android-${{ matrix.arch }} --help > /dev/null
          echo "✅ Smoke test passed"

      - uses: actions/upload-artifact@v7
        with:
          name: aria2c-android-${{ matrix.arch }}
          path: aria2-src/dist/aria2c-android-${{ matrix.arch }}
          compression-level: 0

  create-release:
    needs:
      - build-linux
      - build-macos
      - build-windows
      - build-android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: aria2c-*

      - name: Determine version
        id: version
        run: |
          # github.ref_name for tag push, inputs.version for dispatch
          REF_NAME="${{ github.ref_name }}"
          if [ -n "$REF_NAME" ]; then
            VER="${REF_NAME#v}"
          else
            VER="${{ inputs.version }}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          # Get upstream commit SHA for provenance
          git clone --depth 1 https://github.com/aria2/aria2.git /tmp/aria2-upstream
          cd /tmp/aria2-upstream
          echo "upstream_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream_message=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          rm -rf /tmp/aria2-upstream

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Flatten the artifact directories into a single directory
          find dist -type f -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          md5sum * > MD5SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          UPSTREAM_SHA="${{ steps.version.outputs.upstream_sha }}"

          # Build release notes
          cat > release-notes.md << EOF
          ## aria2 $VERSION (static binaries)

          **aria2** $VERSION built statically for all platforms.

          ### Included platforms

          | Platform | Arch | Binary |
          |---|---|---|
          | Linux (glibc) | x86_64 | \`aria2c-linux-x86_64\` |
          | Linux (glibc) | aarch64 | \`aria2c-linux-aarch64\` |
          | Linux (glibc) | armv7 | \`aria2c-linux-armv7\` |
          | macOS | x86_64 | \`aria2c-darwin-x86_64\` |
          | macOS | Apple Silicon | \`aria2c-darwin-arm64\` |
          | Windows | amd64 | \`aria2c-windows-amd64.exe\` |
          | Android | aarch64 | \`aria2c-android-aarch64\` |
          | Android | armv7 | \`aria2c-android-armv7\` |
          | Android | x86_64 | \`aria2c-android-x86_64\` |

          ### Build info

          - Upstream: [aria2/aria2@\`${UPSTREAM_SHA:0:12}\`](https://github.com/aria2/aria2/commit/$UPSTREAM_SHA)
          - Build system: Static with OpenSSL, c-ares, expat, zlib (no libssh2 on Android)
          - Checksums attached

          ### Features enabled

          - HTTP/HTTPS, FTP, SFTP
          - BitTorrent (DHT, PEX, MSE/PSE, UDP tracker)
          - Metalink (v3, v4)
          - JSON-RPC (HTTP) and XML-RPC
          - Async DNS (c-ares)
          - IPv6 with Happy Eyeballs

          ### Notes

          - These are fully static binaries — no runtime dependencies
          - macOS binaries are signed by the CI runner
          - Windows binary built with MSYS2/MINGW64
          - Android binaries built with NDK ${{ env.NDK_VERSION }}, API ${{ env.ANDROID_API }}
          EOF

          VERIFY_FLAG="${{ github.ref_type == 'tag' && '--verify-tag' || '' }}"
          gh release create "v$VERSION" \
            --title "aria2 v$VERSION" \
            --notes-file release-notes.md \
            $VERIFY_FLAG \
            release-assets/*
